<text x="140.0" y="133.0" text-anchor="middle" class="n">Multi-repo orchestrator</text>
<text x="140.0" y="151.0" text-anchor="middle" class="s">LangGraph or local runner</text></g>
<g id="d"><rect x="40" y="200" width="200" height="70" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="140.0" y="233.0" text-anchor="middle" class="n">AST delta gate</text>
<text x="140.0" y="251.0" text-anchor="middle" class="s">structural hashing</text></g>
<g id="h"><rect x="380" y="100" width="200" height="70" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="480.0" y="133.0" text-anchor="middle" class="n">PreToolUse hooks</text>
<text x="480.0" y="151.0" text-anchor="middle" class="s">block, archive, guard</text></g>
<g id="r"><rect x="380" y="200" width="200" height="70" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="480.0" y="233.0" text-anchor="middle" class="n">Skill router</text>
<text x="480.0" y="251.0" text-anchor="middle" class="s">progressive disclosure</text></g>

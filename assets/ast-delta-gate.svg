<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d">
<title id="t">AST delta gate</title><desc id="d">Structural change triggers regeneration. Body edits do not.</desc>
<style>
text{font-family:'Inter','Segoe UI',Arial,sans-serif;fill:#E5E7EB}
.h{font-size:22px;font-weight:700}.n{font-size:15px;font-weight:600}.s{font-size:12px;fill:#9CA3AF}
.e{fill:none;stroke-width:2.5;stroke-dasharray:8 8;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.p{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.e,.p{animation:none}}
</style>
<rect width="960" height="320" fill="#0B0F19"/>
<text x="30" y="42" class="h">AST delta gate</text>
<text x="30" y="64" class="s">Structural change triggers regeneration. Body edits do not.</text>
<path d="M160 170 L210 170" class="e" stroke="#FBBF24"/>
<polygon points="210 170 201 165 201 175" fill="#FBBF24"/>
<path d="M340 170 L390 170" class="e" stroke="#FBBF24"/>
<polygon points="390 170 381 165 381 175" fill="#FBBF24"/>
<path d="M520 170 L570 170" class="e" stroke="#FBBF24"/>
<polygon points="570 170 561 165 561 175" fill="#FBBF24"/>
<path d="M700 170 L730 170 L730 100 L760 100" class="e" stroke="#F97316"/>
<polygon points="760 100 751 95 751 105" fill="#F97316"/>
<path d="M700 170 L730 170 L730 250 L760 250" class="e" stroke="#F43F5E"/>
<polygon points="760 250 751 245 751 255" fill="#F43F5E"/>
<g id="src"><rect x="30" y="140" width="130" height="60" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="95.0" y="168.0" text-anchor="middle" class="n">Source tree</text>
<text x="95.0" y="186.0" text-anchor="middle" class="s">*.py files</text></g>
<g id="ast"><rect x="210" y="140" width="130" height="60" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="275.0" y="168.0" text-anchor="middle" class="n">Normalise</text>
<text x="275.0" y="186.0" text-anchor="middle" class="s">strip docstrings</text></g>
<g id="hash"><rect x="390" y="140" width="130" height="60" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="455.0" y="168.0" text-anchor="middle" class="n">Hash</text>
<text x="455.0" y="186.0" text-anchor="middle" class="s">sig and body</text></g>
<g id="diff" class="p"><rect x="570" y="140" width="130" height="60" rx="10" fill="#141A2A" stroke="#7C3AED" stroke-width="2"/>
<text x="635.0" y="168.0" text-anchor="middle" class="n">Diff</text>
<text x="635.0" y="186.0" text-anchor="middle" class="s">vs stored graph</text></g>
<g id="regen"><rect x="760" y="70" width="170" height="60" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="845.0" y="98.0" text-anchor="middle" class="n">Regenerate</text>
<text x="845.0" y="116.0" text-anchor="middle" class="s">README and SVG</text></g>
<g id="skip"><rect x="760" y="220" width="170" height="60" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="845.0" y="248.0" text-anchor="middle" class="n">Skip</text>
<text x="845.0" y="266.0" text-anchor="middle" class="s">internal edits only</text></g>
</svg>

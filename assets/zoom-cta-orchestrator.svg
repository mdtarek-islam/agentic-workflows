<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
<title id="t">Zoom transcript-to-CTA email orchestrator</title><desc id="d">Six steps across five departments. A person approves every email before dispatch.</desc>
<style>
text{font-family:'Inter','Segoe UI',Arial,sans-serif;fill:#E5E7EB}
.h{font-size:22px;font-weight:700}.n{font-size:15px;font-weight:600}.s{font-size:12px;fill:#9CA3AF}
.k{font-size:11px;font-weight:700;letter-spacing:1px}.z{font-size:13px;font-weight:600}
.e{fill:none;stroke-width:2.5;stroke-dasharray:8 8;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.p{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.e,.p{animation:none}}
</style>
<rect width="960" height="600" fill="#0B0F19"/>
<text x="30" y="42" class="h">Zoom transcript-to-CTA email orchestrator</text>
<text x="30" y="64" class="s">Six steps across five departments. A person approves every email before dispatch.</text>
<rect x="20" y="90" width="280" height="330" rx="12" fill="#0F1422" stroke="#FBBF24" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="34" y="112" class="z" fill="#FBBF24" style="fill:#FBBF24">Gmail Department [Steps 1 and 5]</text>
<rect x="330" y="90" width="300" height="150" rx="12" fill="#0F1422" stroke="#F97316" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="344" y="112" class="z" fill="#F97316" style="fill:#F97316">Zoom Department [Step 2]</text>
<rect x="660" y="90" width="280" height="150" rx="12" fill="#0F1422" stroke="#F43F5E" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="674" y="112" class="z" fill="#F43F5E" style="fill:#F43F5E">Processing Department [Step 3]</text>
<rect x="660" y="270" width="280" height="150" rx="12" fill="#0F1422" stroke="#F43F5E" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="674" y="292" class="z" fill="#F43F5E" style="fill:#F43F5E">Boss Approval Office [Step 4]</text>
<rect x="20" y="450" width="920" height="130" rx="12" fill="#0F1422" stroke="#FBBF24" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="34" y="472" class="z" fill="#FBBF24" style="fill:#FBBF24">Team Recipients [Step 6]</text>
<path d="M280 170 L360 170" class="e" stroke="#FBBF24"/>
<polygon points="360 170 351 165 351 175" fill="#FBBF24"/>
<path d="M600 170 L680 170" class="e" stroke="#F97316"/>
<polygon points="680 170 671 165 671 175" fill="#F97316"/>
<path d="M800 215 L800 305" class="e" stroke="#F43F5E"/>
<polygon points="800 305 795 296 805 296" fill="#F43F5E"/>
<path d="M680 350 L280 350" class="e" stroke="#F43F5E"/>
<polygon points="280 350 289 345 289 355" fill="#F43F5E"/>
<path d="M250 395 L250 520 L360 520" class="e" stroke="#FBBF24"/>
<polygon points="360 520 351 515 351 525" fill="#FBBF24"/>
<g id="s1"><rect x="40" y="125" width="240" height="90" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="160.0" y="156.0" text-anchor="middle" class="k" style="fill:#FBBF24">STEP 1</text>
<text x="160.0" y="174.0" text-anchor="middle" class="n">Receive transcript</text>
<text x="160.0" y="192.0" text-anchor="middle" class="s">Zoom transcript email arrives</text>
</g>
<g id="s2"><rect x="360" y="125" width="240" height="90" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="480.0" y="156.0" text-anchor="middle" class="k" style="fill:#FBBF24">STEP 2</text>
<text x="480.0" y="174.0" text-anchor="middle" class="n">Parse transcript</text>
<text x="480.0" y="192.0" text-anchor="middle" class="s">Zoom transcript read in full</text>
</g>
<g id="s3"><rect x="680" y="125" width="240" height="90" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="800.0" y="156.0" text-anchor="middle" class="k" style="fill:#FBBF24">STEP 3</text>
<text x="800.0" y="174.0" text-anchor="middle" class="n">Extract and draft</text>
<text x="800.0" y="192.0" text-anchor="middle" class="s">actions, owners, deadlines</text>
</g>
<g id="s4" class="p"><rect x="680" y="305" width="240" height="90" rx="10" fill="#141A2A" stroke="#7C3AED" stroke-width="2"/>
<text x="800.0" y="336.0" text-anchor="middle" class="k" style="fill:#7C3AED">STEP 4</text>
<text x="800.0" y="354.0" text-anchor="middle" class="n">Review and approve</text>
<text x="800.0" y="372.0" text-anchor="middle" class="s">the boss signs off the draft</text>
</g>
<g id="s5"><rect x="40" y="305" width="240" height="90" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="160.0" y="336.0" text-anchor="middle" class="k" style="fill:#FBBF24">STEP 5</text>
<text x="160.0" y="354.0" text-anchor="middle" class="n">Send approved email</text>
<text x="160.0" y="372.0" text-anchor="middle" class="s">only after sign-off</text>
</g>
<g id="s6"><rect x="360" y="480" width="240" height="80" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="480.0" y="506.0" text-anchor="middle" class="k" style="fill:#FBBF24">STEP 6</text>
<text x="480.0" y="524.0" text-anchor="middle" class="n">Team receives</text>
<text x="480.0" y="542.0" text-anchor="middle" class="s">actions and deadlines</text>
</g>
<text x="470" y="338" text-anchor="middle" class="s">approved draft only</text>
<text x="470" y="375" text-anchor="middle" class="s">a person approves every email</text>
</svg>

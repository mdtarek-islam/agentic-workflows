<polygon points="620 175 611 170 611 180" fill="#F43F5E"/>
<path d="M540 255 L580 255 L580 190 L620 190" class="e" stroke="#F43F5E"/>
<polygon points="620 190 611 185 611 195" fill="#F43F5E"/>
<path d="M750 180 L800 180" class="e" stroke="#FBBF24"/>
<polygon points="800 180 791 175 791 185" fill="#FBBF24"/>
<g id="ev"><rect x="30" y="150" width="120" height="60" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="90.0" y="178.0" text-anchor="middle" class="n">Event</text>
<text x="90.0" y="196.0" text-anchor="middle" class="s">changed files</text></g>
<g id="tri" class="p"><rect x="190" y="150" width="120" height="60" rx="10" fill="#141A2A" stroke="#7C3AED" stroke-width="2"/>
<text x="250.0" y="178.0" text-anchor="middle" class="n">Triage</text>
<text x="250.0" y="196.0" text-anchor="middle" class="s">pick audits</text></g>
<g id="a1"><rect x="380" y="70" width="160" height="50" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="460.0" y="93.0" text-anchor="middle" class="n">Secret scan</text>
<text x="460.0" y="111.0" text-anchor="middle" class="s">regex rules</text></g>
<g id="a2"><rect x="380" y="150" width="160" height="50" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="460.0" y="173.0" text-anchor="middle" class="n">Dependency audit</text>
<text x="460.0" y="191.0" text-anchor="middle" class="s">advisory table</text></g>
<g id="a3"><rect x="380" y="230" width="160" height="50" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="460.0" y="253.0" text-anchor="middle" class="n">Licence check</text>
<text x="460.0" y="271.0" text-anchor="middle" class="s">allowlist</text></g>
<g id="rev"><rect x="620" y="150" width="130" height="60" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>

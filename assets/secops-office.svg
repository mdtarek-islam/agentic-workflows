<text x="685.0" y="196.0" text-anchor="middle" class="s">merge findings</text></g>
<g id="ver"><rect x="800" y="150" width="130" height="60" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="865.0" y="178.0" text-anchor="middle" class="n">Verdict</text>
<text x="865.0" y="196.0" text-anchor="middle" class="s">approve or block</text></g>

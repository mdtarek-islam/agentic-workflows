<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" width="980" height="320" role="img" aria-labelledby="t d">
<title id="t">CRM bespoke task and pricing invoicing pipeline</title><desc id="d">One unattended scheduled run per week reads tasks, prices them, checks them and commits to the CRM.</desc>
<style>
text{font-family:'Inter','Segoe UI',Arial,sans-serif;fill:#E5E7EB}
.h{font-size:22px;font-weight:700}.n{font-size:15px;font-weight:600}.s{font-size:12px;fill:#9CA3AF}
.k{font-size:11px;font-weight:700;letter-spacing:1px}.z{font-size:13px;font-weight:600}
.e{fill:none;stroke-width:2.5;stroke-dasharray:8 8;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.p{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.e,.p{animation:none}}
</style>
<rect width="980" height="320" fill="#0B0F19"/>
<text x="30" y="42" class="h">CRM bespoke task and pricing invoicing pipeline</text>
<text x="30" y="64" class="s">One unattended scheduled run per week reads tasks, prices them, checks them and commits to the CRM.</text>
<path d="M230 175 L270 175" class="e" stroke="#FBBF24"/>
<polygon points="270 175 261 170 261 180" fill="#FBBF24"/>
<path d="M470 175 L510 175" class="e" stroke="#F97316"/>
<polygon points="510 175 501 170 501 180" fill="#F97316"/>
<path d="M710 175 L750 175" class="e" stroke="#F43F5E"/>
<polygon points="750 175 741 170 741 180" fill="#F43F5E"/>
<path d="M850 230 L850 270 L130 270 L130 230" class="e" stroke="#FBBF24"/>
<polygon points="130 230 125 239 135 239" fill="#FBBF24"/>
<g id="c1"><rect x="30" y="120" width="200" height="110" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="130.0" y="152.0" text-anchor="middle" class="k" style="fill:#FBBF24">STAGE 1</text>
<text x="130.0" y="170.0" text-anchor="middle" class="n">Windows Task</text>
<text x="130.0" y="188.0" text-anchor="middle" class="n">Scheduler</text>
<text x="130.0" y="206.0" text-anchor="middle" class="s">weekly unattended trigger</text>
</g>
<g id="c2"><rect x="270" y="120" width="200" height="110" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="370.0" y="152.0" text-anchor="middle" class="k" style="fill:#FBBF24">STAGE 2</text>
<text x="370.0" y="170.0" text-anchor="middle" class="n">Bespoke Task and</text>
<text x="370.0" y="188.0" text-anchor="middle" class="n">Pricing Matrix Reader</text>
<text x="370.0" y="206.0" text-anchor="middle" class="s">task to pricing tier</text>
</g>
<g id="c3" class="p"><rect x="510" y="120" width="200" height="110" rx="10" fill="#141A2A" stroke="#7C3AED" stroke-width="2"/>
<text x="610.0" y="152.0" text-anchor="middle" class="k" style="fill:#7C3AED">STAGE 3</text>
<text x="610.0" y="170.0" text-anchor="middle" class="n">Validation</text>
<text x="610.0" y="188.0" text-anchor="middle" class="n">Engine</text>
<text x="610.0" y="206.0" text-anchor="middle" class="s">checks tier and amount</text>
</g>
<g id="c4"><rect x="750" y="120" width="200" height="110" rx="10" fill="#141A2A" stroke="#2A3350" stroke-width="2"/>
<text x="850.0" y="152.0" text-anchor="middle" class="k" style="fill:#FBBF24">STAGE 4</text>
<text x="850.0" y="170.0" text-anchor="middle" class="n">Automated Weekly</text>
<text x="850.0" y="188.0" text-anchor="middle" class="n">CRM Commit</text>
<text x="850.0" y="206.0" text-anchor="middle" class="s">Power Automate</text>
</g>
<text x="490" y="292" text-anchor="middle" class="s">next weekly run</text>
</svg>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-workflows"
version = "0.1.0"
description = "Executable reference blueprints for agentic engineering workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MD Tarek Islam" }]
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=1.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agentic_workflows*"]

[tool.setuptools.package-data]
"*" = ["*.sh", "*.json", "*.md", "*.yml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
